<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Chapter Mastery App</title>
  <!-- PWA Web App Manifest inline for single-file compliance -->
  <link rel="manifest" id="manifest-placeholder">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --accent: #f59e0b;
      --success: #10b981;
      --danger: #ef4444;
      --text: #1f2937;
      --text-muted: #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-gradient); min-height: 100vh; color: var(--text); padding: 15px; display: flex; justify-content: center; align-items: center; }

    .app-container {
      width: 100%; max-width: 850px; background: var(--card-bg); border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      padding: 24px; display: flex; flex-direction: column; gap: 20px; min-height: 600px;
    }

    /* Top Navigation & Controls */
    header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; border-bottom: 2px solid #f3f4f6; padding-bottom: 15px; }
    .select-group { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
    select { padding: 8px 12px; border-radius: 8px; border: 1.5px solid #e5e7eb; background-color: #f9fafb; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
    select:focus { outline: none; border-color: var(--primary); }

    /* Travel Mode & Voice controls */
    .travel-mode-btn {
      display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 20px; border: none;
      background: #e0e7ff; color: var(--primary); font-weight: 700; cursor: pointer; transition: all 0.2s;
    }
    .travel-mode-btn.active { background: var(--accent); color: white; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }

    /* Accuracy Heatmap Bar */
    .heatmap-bar { display: flex; gap: 4px; height: 10px; background: #e5e7eb; border-radius: 5px; overflow: hidden; margin-top: -10px; }
    .heatmap-segment { flex: 1; height: 100%; background: #d1d5db; transition: background 0.3s; }
    .heatmap-segment.high { background: var(--success); }
    .heatmap-segment.med { background: var(--accent); }
    .heatmap-segment.low { background: var(--danger); }

    /* Main Question View */
    .quiz-card { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 15px; position: relative; }
    .q-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    .q-badge { background: #e0e7ff; color: var(--primary); padding: 4px 10px; border-radius: 12px; }
    .q-text { font-size: 1.15rem; font-weight: 600; color: #111827; line-height: 1.5; margin-top: 5px; }

    /* Inputs & Options */
    .options-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .opt-btn {
      padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 10px; text-align: left;
      background: white; font-size: 1rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between;
    }
    .opt-btn:hover { border-color: var(--primary); background: #f5f3ff; }
    .opt-btn.correct { border-color: var(--success); background: #d1fae5; color: #065f46; font-weight: bold; }
    .opt-btn.wrong { border-color: var(--danger); background: #fee2e2; color: #991b1b; }

    /* Text Input with Signature Overlay */
    .text-input-wrap { position: relative; width: 100%; margin-top: 10px; }
    .text-input {
      width: 100%; padding: 14px; border-radius: 10px; border: 2px solid #d1d5db; font-size: 1.1rem; outline: none; transition: border-color 0.2s;
    }
    .text-input:focus { border-color: var(--primary); }
    .signature-overlay {
      position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
      font-size: 1.8rem; font-weight: 900; pointer-events: none; opacity: 0; transition: opacity 0.2s;
    }
    .signature-overlay.show { opacity: 1; }
    .signature-overlay.tick { color: var(--success); }
    .signature-overlay.cross { color: var(--danger); }

    .correct-answer-banner {
      display: none; background: var(--success); color: white; padding: 10px 14px; border-radius: 8px; font-weight: bold; margin-top: 10px;
    }

    /* Actions & Bottom Nav */
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 2px solid #f3f4f6; padding-top: 15px; }
    .btn { padding: 10px 20px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 6px; }
    .btn-secondary { background: #f3f4f6; color: var(--text); }
    .btn-secondary:hover { background: #e5e7eb; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-mic { background: #ef4444; color: white; border-radius: 50%; width: 42px; height: 42px; padding: 0; justify-content: center; }
    .btn-mic.listening { animation: pulse 1s infinite; background: var(--success); }

    /* Results Screen */
    .results-screen { display: none; text-align: center; flex-direction: column; gap: 20px; }
    .score-circle { width: 120px; height: 120px; border-radius: 50%; background: #e0e7ff; color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; margin: 0 auto; border: 4px solid var(--primary); }

    /* Printable Revision / Notebook View */
    .printable-sheet { display: none; flex-direction: column; gap: 15px; }
    @media print {
      body * { visibility: hidden; }
      .printable-sheet, .printable-sheet * { visibility: visible; }
      .printable-sheet { position: absolute; left: 0; top: 0; width: 100%; color: black; background: white; padding: 0; }
      .no-print { display: none !important; }
    }

    /* Placeholder screen for coming soon */
    .coming-soon { display: none; text-align: center; padding: 40px; font-size: 1.2rem; color: var(--text-muted); }
  </style>
</head>
<body>

<div class="app-container">
  <header class="no-print">
    <div class="select-group">
      <select id="classSelect" onchange="handleScopeChange()">
        <option value="Class 9">Class 9</option>
        <option value="Class 10">Class 10 (Coming soon)</option>
      </select>
      <select id="subjectSelect" onchange="handleScopeChange()">
        <option value="Science">Science</option>
        <option value="Social Science">Social Science</option>
      </select>
      <select id="chapterSelect" onchange="handleScopeChange()"></select>
      <select id="pageSelect" onchange="handleScopeChange()"></select>
    </div>
    <button class="travel-mode-btn" id="travelBtn" onclick="toggleTravelMode()">
      ✈️ Travel Mode <span id="travelStatus">OFF</span>
    </button>
  </header>

  <!-- Heatmap accuracy indicator -->
  <div class="heatmap-bar no-print" id="heatmapBar" title="Accuracy Heatmap across pages"></div>

  <!-- Standard Quiz View -->
  <div class="quiz-card" id="quizCard">
    <div class="q-meta">
      <span class="q-badge" id="qFormatBadge">MCQ</span>
      <span id="qProgress">Q 1 / 20</span>
      <button class="btn btn-secondary" onclick="speakCurrentQuestion()" title="Listen Question">🔊 Listen</button>
    </div>

    <div class="q-text" id="qText">Loading question...</div>

    <div id="interactiveArea">
      <!-- Options or inputs inserted dynamically -->
    </div>

    <div class="correct-answer-banner" id="correctBanner"></div>

    <div class="controls no-print">
      <button class="btn btn-secondary" onclick="prevQuestion()">Previous</button>
      <button class="btn btn-mic" id="micBtn" onclick="toggleMic()" title="Tap to Speak">🎙️</button>
      <button class="btn btn-secondary" onclick="skipQuestion()">Skip</button>
      <button class="btn btn-primary" onclick="nextQuestion()">Next</button>
    </div>
  </div>

  <!-- Coming Soon UI placeholder -->
  <div class="coming-soon" id="comingSoonCard">
    <h2>🚀 Content Coming Soon!</h2>
    <p>This Class, Subject, or Chapter is currently under development.</p>
  </div>

  <!-- Results Screen -->
  <div class="results-screen" id="resultsScreen">
    <h2>Test Completed! 🎉</h2>
    <div class="score-circle" id="scoreCircle">0/20</div>
    <p id="scoreSummary">Great job practicing!</p>
    <div style="display: flex; gap: 10px; justify-content: center;" class="no-print">
      <button class="btn btn-primary" onclick="initTest('retest')">Retest Missed</button>
      <button class="btn btn-primary" onclick="initTest('new')">New Question Set</button>
      <button class="btn btn-secondary" onclick="openRevisionSheet()">View Mistake Notebook</button>
    </div>
  </div>

  <!-- Printable Revision Sheet / Auto Mistake Notebook -->
  <div class="printable-sheet" id="revisionSheet">
    <div class="no-print" style="display:flex; justify-content:space-between; align-items:center;">
      <button class="btn btn-secondary" onclick="closeRevisionSheet()">← Back to App</button>
      <button class="btn btn-primary" onclick="window.print()">🖨️ Print Revision Sheet</button>
    </div>
    <h2>Auto Mistake Notebook & Revision Sheet</h2>
    <hr>
    <div id="mistakeList"></div>
  </div>
</div>

<script>
/=============================================================================
  EXAM DATA STRUCTURE
  Excludes ignored Science pages (12,13,23,24,25,36,37,47,48,71,85,86,98,99,111,112,125,126,138,139,152,153,154)
=============================================================================*/
const EXAM_DATA = {
  "Class 9": {

          { "id": "sc1_p1_2", "type": "fill_in_the_blanks", "question": "Early Indian philosophers classified matter into five basic elements called the dash.", "answer": "Panch Tatva" },

          { "id": "sc1_p1_4", "type": "one_word", "question": "What physical property measures the amount of space an object occupies?", "answer": "Volume" },

        ],

          { "id": "sc1_p2_1", "type": "mcq", "question": "What is the nature of matter according to modern scientists?", "options": ["Continuous like wood", "Particulate like sand", "Liquid only", "Wave-like"], "answer": "Particulate like sand" },
          { "id": "sc1_p2_2", "type": "fill_in_the_blanks", "question": "When salt dissolves in water, its particles get into the dash between particles of water.", "answer": "spaces" },
          { "id": "sc1_p2_3", "type": "true_false", "question": "Particles of matter are visible to the naked eye without a microscope.", "answer": "False" },
          { "id": "sc1_p2_4", "type": "one_word", "question": "From Activity 1.2, potassium permanganate crystals keep imparting color to water even after repeated...", "answer": "Dilution" },
          { "id": "sc1_p2_5", "type": "mcq", "question": "Particles of matter are extremely small, beyond our...", "options": ["Imagination", "Microscopes", "Calculations", "Reach"], "answer": "Imagination" }
        ],
        "3": [
          { "id": "sc1_p3_1", "type": "mcq", "question": "Particles of matter possess kinetic energy because they are continuously...", "options": ["Stationary", "Moving", "Vibrating in place", "Expanding"], "answer": "Moving" },
          { "id": "sc1_p3_2", "type": "fill_in_the_blanks", "question": "With increase in temperature, kinetic energy of particles dash.", "answer": "increases" },
          { "id": "sc1_p3_3", "type": "true_false", "question": "Intermixing of particles of two different types of matter on their own is called diffusion.", "answer": "True" },
          { "id": "sc1_p3_4", "type": "one_word", "question": "What process occurs faster when hot food smell reaches us meters away?", "answer": "Diffusion" },
          { "id": "sc1_p3_5", "type": "mcq", "question": "On heating, rate of diffusion becomes...", "options": ["Slower", "Faster", "Stops", "Unchanged"], "answer": "Faster" }
        ]
      },
      "Chapter 2: Is Matter Around Us Pure": {
        "1": [
          { "id": "sc2_p1_1", "type": "mcq", "question": "To a common person, 'pure' means...", "options": ["Adulteration free", "Single type of particle", "Laboratory synthesized", "Boiled"], "answer": "Adulteration free" },
          { "id": "sc2_p1_2", "type": "fill_in_the_blanks", "question": "A substance is a pure single form of dash.", "answer": "matter" },
          { "id": "sc2_p1_3", "type": "true_false", "question": "Milk is a pure substance scientifically.", "answer": "False" },
          { "id": "sc2_p1_4", "type": "one_word", "question": "What is formed when two or more pure substances mix without chemical bonding?", "answer": "Mixture" },
          { "id": "sc2_p1_5", "type": "mcq", "question": "Which of these is a mixture?", "options": ["Sodium Chloride", "Pure Water", "Sea Water", "Gold"], "answer": "Sea Water" }
        ]
      }
    },
    "Social Science": {
      "Chapter 1: The French Revolution": {
        "1": [
          { "id": "sst1_p1_1", "type": "mcq", "question": "In 1789, the King of France was...", "options": ["Louis XVI", "Louis XIV", "Napoleon", "Robespierre"], "answer": "Louis XVI" },
          { "id": "sst1_p1_2", "type": "fill_in_the_blanks", "question": "French society in the 18th century was divided into three dash.", "answer": "estates" },
          { "id": "sst1_p1_3", "type": "true_false", "question": "Only members of the Third Estate paid taxes.", "answer": "True" },
          { "id": "sst1_p1_4", "type": "one_word", "question": "What fortress-prison was stormed on 14th July 1789?", "answer": "Bastille" },
          { "id": "sst1_p1_5", "type": "mcq", "question": "Tax levied by the church equal to one-tenth of agricultural produce was...", "options": ["Taille", "Tithe", "Livre", "Manor"], "answer": "Tithe" }
        ]
      },
      "Chapter 2: Socialism in Europe": {
        "1": [
          { "id": "sst2_p1_1", "type": "mcq", "question": "Which group wanted a nation which tolerated all religions in Russia?", "options": ["Liberals", "Radicals", "Conservatives", "Democrats"], "answer": "Liberals" },
          { "id": "sst2_p1_2", "type": "fill_in_the_blanks", "question": "Marx argued that industrial society was dash.", "answer": "capitalist" },
          { "id": "sst2_p1_3", "type": "true_false", "question": "Radicals opposed women's suffragette movements.", "answer": "False" },
          { "id": "sst2_p1_4", "type": "one_word", "question": "Ruler of Russia in 1914 was Tsar...", "answer": "Nicholas II" },
          { "id": "sst2_p1_5", "type": "mcq", "question": "Russian Social Democratic Workers Party was founded in...", "options": ["1898", "1905", "1917", "1923"], "answer": "1898" }
        ]
      }
    }
  }
};

/* State Variables */
let currentScopeQuestions = [];
let currentTestSet = [];
let currentIndex = 0;
let userAnswers = {};
let attemptsLeft = {};
let travelMode = false;
let recognition = null;

/* LocalStorage Persistence Utilities */
function getStorageKey(suffix) {
  const cls = document.getElementById('classSelect').value;
  const sub = document.getElementById('subjectSelect').value;
  const ch = document.getElementById('chapterSelect').value;
  const pg = document.getElementById('pageSelect').value;
  return `${cls}_${sub}_${ch}_${pg}_${suffix}`;
}

function loadProgress() {
  const seenIds = JSON.parse(localStorage.getItem(getStorageKey('seen')) || '[]');
  return seenIds;
}

function saveProgress(qId) {
  const seenIds = loadProgress();
  if (!seenIds.includes(qId)) {
    seenIds.push(qId);
    localStorage.setItem(getStorageKey('seen'), JSON.stringify(seenIds));
  }
}

/* App Initialization & Select Handlers */
function initApp() {
  populateChapters();
  setupPWA();
  setupSpeechRecognition();
}

function populateChapters() {
  const cls = document.getElementById('classSelect').value;
  const sub = document.getElementById('subjectSelect').value;
  const chSelect = document.getElementById('chapterSelect');
  chSelect.innerHTML = '';

  if (EXAM_DATA[cls] && EXAM_DATA[cls][sub]) {
    Object.keys(EXAM_DATA[cls][sub]).forEach(ch => {
      let opt = document.createElement('option');
      opt.value = ch; opt.innerText = ch;
      chSelect.appendChild(opt);
    });
  } else {
    let opt = document.createElement('option');
    opt.value = "none"; opt.innerText = "No chapters available";
    chSelect.appendChild(opt);
  }
  populatePages();
}

function populatePages() {
  const cls = document.getElementById('classSelect').value;
  const sub = document.getElementById('subjectSelect').value;
  const ch = document.getElementById('chapterSelect').value;
  const pgSelect = document.getElementById('pageSelect');
  pgSelect.innerHTML = '';

  if (EXAM_DATA[cls] && EXAM_DATA[cls][sub] && EXAM_DATA[cls][sub][ch]) {
    let allOpt = document.createElement('option');
    allOpt.value = "whole"; allOpt.innerText = "Whole Chapter";
    pgSelect.appendChild(allOpt);

    Object.keys(EXAM_DATA[cls][sub][ch]).forEach(pg => {
      let opt = document.createElement('option');
      opt.value = pg; opt.innerText = `Page ${pg}`;
      pgSelect.appendChild(opt);
    });
  }
  handleScopeChange();
}

function handleScopeChange() {
  const cls = document.getElementById('classSelect').value;
  const sub = document.getElementById('subjectSelect').value;
  const ch = document.getElementById('chapterSelect').value;
  const quizCard = document.getElementById('quizCard');
  const comingSoon = document.getElementById('comingSoonCard');

  if (cls.includes('Coming soon') || !EXAM_DATA[cls] || !EXAM_DATA[cls][sub] || !EXAM_DATA[cls][sub][ch]) {
    quizCard.style.display = 'none';
    comingSoon.style.display = 'block';
    return;
  }

  quizCard.style.display = 'flex';
  comingSoon.style.display = 'none';
  document.getElementById('resultsScreen').style.display = 'none';
  document.getElementById('revisionSheet').style.display = 'none';

  gatherScopeQuestions();
  renderHeatmap();
  initTest('new');
}

function gatherScopeQuestions() {
  const cls = document.getElementById('classSelect').value;
  const sub = document.getElementById('subjectSelect').value;
  const ch = document.getElementById('chapterSelect').value;
  const pg = document.getElementById('pageSelect').value;

  currentScopeQuestions = [];
  const chObj = EXAM_DATA[cls][sub][ch];

  if (pg === 'whole') {
    Object.keys(chObj).forEach(pageKey => {
      currentScopeQuestions.push(...chObj[pageKey]);
    });
  } else if (chObj[pg]) {
    currentScopeQuestions.push(...chObj[pg]);
  }
}

/* Sample unseen questions first, picking max 20 questions across formats */
function initTest(mode = 'new') {
  const seenIds = loadProgress();
  let pool = [...currentScopeQuestions];

  if (mode === 'retest') {
    pool = pool.filter(q => userAnswers[q.id] && !userAnswers[q.id].isCorrect);
    if (pool.length === 0) pool = [...currentScopeQuestions];
  }

  // Sort unseen first
  pool.sort((a, b) => (seenIds.includes(a.id) ? 1 : -1));

  // Balanced sampling across formats (5 per format max if available)
  const formats = ['mcq', 'fill_in_the_blanks', 'one_word', 'true_false'];
  let selected = [];

  formats.forEach(fmt => {
    let fmtQuestions = pool.filter(q => q.type === fmt).slice(0, 5);
    selected.push(...fmtQuestions);
  });

  // Top up to 20 if pool has remaining
  if (selected.length < 20) {
    let remaining = pool.filter(q => !selected.includes(q));
    selected.push(...remaining.slice(0, 20 - selected.length));
  }

  currentTestSet = selected;
  currentIndex = 0;
  userAnswers = {};
  attemptsLeft = {};
  currentTestSet.forEach(q => attemptsLeft[q.id] = 2);

  renderQuestion();
}

/* Render current question interface */
function renderQuestion() {
  if (currentTestSet.length === 0) {
    document.getElementById('qText').innerText = "No questions available for this selection.";
    document.getElementById('interactiveArea').innerHTML = '';
    return;
  }

  const q = currentTestSet[currentIndex];
  document.getElementById('qProgress').innerText = `Q ${currentIndex + 1} / ${currentTestSet.length}`;
  document.getElementById('qFormatBadge').innerText = q.type.replace(/_/g, ' ').toUpperCase();
  document.getElementById('qText').innerText = q.question;

  const area = document.getElementById('interactiveArea');
  const banner = document.getElementById('correctBanner');
  banner.style.display = 'none';
  area.innerHTML = '';

  if (q.type === 'mcq' || q.type === 'true_false') {
    const opts = q.type === 'true_false' ? ["True", "False"] : q.options;
    const grid = document.createElement('div');
    grid.className = 'options-grid';

    opts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerText = opt;
      btn.onclick = () => handleChoiceAttempt(opt, btn);
      grid.appendChild(btn);
    });
    area.appendChild(grid);
  } else {
    // Fill in blanks / One word
    const wrap = document.createElement('div');
    wrap.className = 'text-input-wrap';
    
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'text-input';
    input.id = 'answerInput';
    input.placeholder = 'Type your answer and press Enter...';
    input.onkeypress = (e) => { if (e.key === 'Enter') handleTextAttempt(); };

    const overlay = document.createElement('div');
    overlay.className = 'signature-overlay';
    overlay.id = 'sigOverlay';

    wrap.appendChild(input);
    wrap.appendChild(overlay);
    area.appendChild(wrap);
  }

  if (travelMode) {
    speakCurrentQuestion(() => {
      if (['fill_in_the_blanks', 'one_word'].includes(q.type)) {
        startListening();
      }
    });
  }
}

/* Attempt Logic - 2 Attempts, Hand-drawn Overlay, Automatic Input Clearing */
function handleChoiceAttempt(chosen, btnEl) {
  const q = currentTestSet[currentIndex];
  if (userAnswers[q.id]?.isCorrect) return;

  const isCorrect = chosen.toLowerCase().trim() === q.answer.toLowerCase().trim();

  if (isCorrect) {
    btnEl.classList.add('correct');
    recordAnswer(q.id, true, chosen);
    if (travelMode) setTimeout(nextQuestion, 1200);
  } else {
    btnEl.classList.add('wrong');
    attemptsLeft[q.id]--;
    if (attemptsLeft[q.id] <= 0) {
      recordAnswer(q.id, false, chosen);
      revealCorrectAnswer(q.answer);
    } else {
      speakTTS("Incorrect. One attempt left.");
    }
  }
}

function handleTextAttempt(valOverride = null) {
  const q = currentTestSet[currentIndex];
  const inputEl = document.getElementById('answerInput');
  const overlay = document.getElementById('sigOverlay');
  const val = valOverride || (inputEl ? inputEl.value : '');

  if (!val.trim()) return;

  const isCorrect = fuzzyMatch(val, q.answer);

  if (isCorrect) {
    overlay.innerText = '✓';
    overlay.className = 'signature-overlay show tick';
    recordAnswer(q.id, true, val);
    setTimeout(() => {
      if (inputEl) inputEl.value = '';
      nextQuestion();
    }, 1000);
  } else {
    overlay.innerText = '✗';
    overlay.className = 'signature-overlay show cross';
    attemptsLeft[q.id]--;

    setTimeout(() => {
      if (inputEl) inputEl.value = ''; // Empty text box automatically
      overlay.className = 'signature-overlay';
    }, 800);

    if (attemptsLeft[q.id] <= 0) {
      recordAnswer(q.id, false, val);
      revealCorrectAnswer(q.answer);
    } else {
      speakTTS("Try again.");
    }
  }
}

function revealCorrectAnswer(ans) {
  const banner = document.getElementById('correctBanner');
  banner.innerText = `Correct Answer: ${ans}`;
  banner.style.display = 'block';
  speakTTS(`The correct answer is ${ans}`);
  if (travelMode) setTimeout(nextQuestion, 2500);
}

function recordAnswer(qId, isCorrect, answerText) {
  userAnswers[qId] = { isCorrect, answerText };
  saveProgress(qId);
  renderHeatmap();
}

/* Fuzzy Matching Engine */
function fuzzyMatch(input, target) {
  const cleanInput = input.toLowerCase().replace(/[^a-z0-9]/g, '').trim();
  const cleanTarget = target.toLowerCase().replace(/[^a-z0-9]/g, '').trim();
  if (cleanInput === cleanTarget) return true;
  if (cleanTarget.length > 4 && cleanInput.includes(cleanTarget)) return true;
  return false;
}

/* Navigation controls */
function nextQuestion() {
  if (currentIndex < currentTestSet.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    showResults();
  }
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

function skipQuestion() {
  nextQuestion();
}

/* Accuracy Heatmap Renderer */
function renderHeatmap() {
  const bar = document.getElementById('heatmapBar');
  bar.innerHTML = '';
  const cls = document.getElementById('classSelect').value;
  const sub = document.getElementById('subjectSelect').value;
  const ch = document.getElementById('chapterSelect').value;
  const chObj = EXAM_DATA[cls]?.[sub]?.[ch] || {};

  const pages = Object.keys(chObj);
  pages.forEach(pg => {
    const qList = chObj[pg];
    const seen = loadProgress();
    const answered = qList.filter(q => userAnswers[q.id]);
    
    let seg = document.createElement('div');
    seg.className = 'heatmap-segment';
    if (answered.length > 0) {
      const corrects = answered.filter(q => userAnswers[q.id].isCorrect).length;
      const ratio = corrects / answered.length;
      if (ratio >= 0.8) seg.classList.add('high');
      else if (ratio >= 0.5) seg.classList.add('med');
      else seg.classList.add('low');
    }
    bar.appendChild(seg);
  });
}

/* Voice TTS & Speech Recognition Engine */
function speakTTS(text, onEndCallback = null) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.95;
  if (onEndCallback) utter.onend = onEndCallback;
  window.speechSynthesis.speak(utter);
}

function speakCurrentQuestion(onEndCallback = null) {
  const q = currentTestSet[currentIndex];
  if (!q) return;

  let spokenText = q.question;
  if (q.type === 'fill_in_the_blanks') {
    spokenText = spokenText.replace(/dash/g, 'blank');
  }
  if (q.type === 'mcq') {
    spokenText += ". Options are: " + q.options.join(", ");
  }
  speakTTS(spokenText, onEndCallback);
}

function setupSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return;

  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    document.getElementById('micBtn').classList.remove('listening');
    const q = currentTestSet[currentIndex];

    if (['mcq', 'true_false'].includes(q.type)) {
      handleChoiceAttempt(transcript, document.activeElement);
    } else {
      handleTextAttempt(transcript);
    }
  };

  recognition.onerror = () => document.getElementById('micBtn').classList.remove('listening');
  recognition.onend = () => document.getElementById('micBtn').classList.remove('listening');
}

function toggleMic() {
  if (!recognition) {
    alert("Speech recognition not supported in this browser.");
    return;
  }
  const btn = document.getElementById('micBtn');
  btn.classList.add('listening');
  recognition.start();
}

function toggleTravelMode() {
  travelMode = !travelMode;
  const btn = document.getElementById('travelBtn');
  const status = document.getElementById('travelStatus');
  if (travelMode) {
    btn.classList.add('active');
    status.innerText = 'ON';
    speakCurrentQuestion();
  } else {
    btn.classList.remove('active');
    status.innerText = 'OFF';
    window.speechSynthesis.cancel();
  }
}

/* Results Screen & Auto Mistake Notebook */
function showResults() {
  document.getElementById('quizCard').style.display = 'none';
  const res = document.getElementById('resultsScreen');
  res.style.display = 'flex';

  const total = currentTestSet.length;
  const correct = Object.values(userAnswers).filter(a => a.isCorrect).length;
  document.getElementById('scoreCircle').innerText = `${correct}/${total}`;
  document.getElementById('scoreSummary').innerText = `You scored ${Math.round((correct/total)*100)}% accuracy!`;
}

function openRevisionSheet() {
  document.getElementById('resultsScreen').style.display = 'none';
  const sheet = document.getElementById('revisionSheet');
  sheet.style.display = 'flex';

  const mistakeContainer = document.getElementById('mistakeList');
  mistakeContainer.innerHTML = '';

  const mistakes = currentTestSet.filter(q => userAnswers[q.id] && !userAnswers[q.id].isCorrect);

  if (mistakes.length === 0) {
    mistakeContainer.innerHTML = '<p>🎉 No mistakes in this session! Outstanding performance.</p>';
    return;
  }

  mistakes.forEach((q, idx) => {
    let item = document.createElement('div');
    item.style.marginBottom = '15px';
    item.style.padding = '10px';
    item.style.borderLeft = '4px solid #ef4444';
    item.style.background = '#fef2f2';
    item.innerHTML = `
      <strong>Q${idx + 1}: ${q.question}</strong><br>
      <span style="color:#991b1b">Your Answer: ${userAnswers[q.id].answerText || 'Skipped'}</span><br>
      <span style="color:#065f46; font-weight:bold;">Correct Answer: ${q.answer}</span>
    `;
    mistakeContainer.appendChild(item);
  });
}

function closeRevisionSheet() {
  document.getElementById('revisionSheet').style.display = 'none';
  document.getElementById('resultsScreen').style.display = 'flex';
}

/* Inline PWA Service Worker Registration */
function setupPWA() {
  const manifest = {
    "name": "Smart Chapter Mastery PWA",
    "short_name": "MasteryPWA",
    "start_url": ".",
    "display": "standalone",
    "background_color": "#4f46e5",
    "theme_color": "#4f46e5",
    "icons": [{ "src": "https://via.placeholder.com/192", "sizes": "192x192", "type": "image/png" }]
  };
  const stringManifest = JSON.stringify(manifest);
  const blob = new Blob([stringManifest], {type: 'application/json'});
  document.getElementById('manifest-placeholder').setAttribute('href', URL.createObjectURL(blob));

  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
      self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
      self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
    `;
    const swBlob = new Blob([swCode], {type: 'text/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
  }
}

window.onload = initApp;
