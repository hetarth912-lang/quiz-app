<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class IX Science Quiz Portal</title>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --correct-bg: #d1fae5;
      --correct-border: #10b981;
      --correct-text: #065f46;
      --wrong-bg: #fee2e2;
      --wrong-border: #ef4444;
      --wrong-text: #991b1b;
      --border-color: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 30px;
      margin-top: 20px;
    }

    header { text-align: center; margin-bottom: 25px; }
    header h1 { color: var(--primary); font-size: 1.8rem; margin-bottom: 8px; }
    header p { color: var(--text-muted); font-size: 0.95rem; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 25px;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .select-group { display: flex; flex-direction: column; gap: 5px; flex-grow: 1; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    
    select {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      outline: none;
      font-size: 0.95rem;
      background: white;
      cursor: pointer;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 11px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      align-self: flex-end;
    }
    .btn:hover { background: var(--primary-hover); }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .q-card {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      background: #fff;
      transition: all 0.2s ease;
    }

    .q-title { font-weight: 600; font-size: 1rem; margin-bottom: 12px; }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .status-icon {
      font-size: 1.2rem;
      font-weight: bold;
      min-width: 24px;
      text-align: center;
    }

    .icon-correct { color: var(--correct-border); }
    .icon-wrong { color: var(--wrong-border); }

    .feedback-msg {
      margin-top: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      display: none;
    }

    /* Input State Styles */
    .is-correct input {
      background-color: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
    }

    .is-wrong input {
      background-color: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
    }

    .revealed-answer {
      color: var(--correct-text);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Class IX Science Practice Portal</h1>
      <p>Instant feedback while typing. 2 attempts allowed per question.</p>
    </header>

    <div class="controls">
      <div class="select-group">
        <label for="chapterSelect">Select Chapter</label>
        <select id="chapterSelect"></select>
      </div>
      <button class="btn" onclick="loadTest()">Generate 20 New Questions</button>
    </div>

    <div class="stats">
      <span id="progressText">Completed: 0 / 20</span>
      <span id="scoreText">Score: 0</span>
    </div>

    <div id="quizContainer"></div>
  </div>

  <script>
    // 12 Chapters Database
    const chapterNames = [
      "1. Matter in Our Surroundings",
      "2. Is Matter Around Us Pure?",
      "3. Atoms and Molecules",
      "4. Structure of the Atom",
      "5. The Fundamental Unit of Life",
      "6. Tissues",
      "7. Motion",
      "8. Force and Laws of Motion",
      "9. Gravitation",
      "10. Work and Energy",
      "11. Sound",
      "12. Improvement in Food Resources"
    ];

    // Sample database with variants for 20 randomized questions per test
    const questionBank = {};

    chapterNames.forEach((ch, idx) => {
      questionBank[idx + 1] = [];
      for (let i = 1; i <= 30; i++) {
        questionBank[idx + 1].push({
          id: `${idx + 1}_${i}`,
          question: `[Chapter ${idx + 1}] Practice Question ${i}: What is the primary standard unit or concept for Topic #${i}?`,
          answer: `answer${i}`
        });
      }
    });

    // Populate Chapter 1 with actual textbook concepts
    questionBank[1] = [
      { question: "SI unit of mass is _____", answer: "kilogram" },
      { question: "SI unit of volume is _____", answer: "cubic metre" },
      { question: "Solid carbon dioxide is commonly known as _____", answer: "dry ice" },
      { question: "Direct change of solid to gas without liquid state is called _____", answer: "sublimation" },
      { question: "Process of change of liquid into vapour below boiling point is _____", answer: "evaporation" },
      { question: "SI unit of temperature is _____", answer: "kelvin" },
      { question: "Rate of diffusion increases with increase in _____", answer: "temperature" },
      { question: "Forces of attraction between particles are maximum in _____", answer: "solids" },
      { question: "Forces of attraction between particles are minimum in _____", answer: "gases" },
      { question: "Boiling temperature of pure water in Celsius scale is _____ °C", answer: "100" },
      { question: "Melting point of ice in Kelvin scale is _____ K", answer: "273" },
      { question: "Evaporation causes a _____ effect.", answer: "cooling" },
      { question: "Amount of heat required to melt 1kg solid at atmospheric pressure is latent heat of _____", answer: "fusion" },
      { question: "Amount of heat required to change 1kg liquid to gas is latent heat of _____", answer: "vaporisation" },
      { question: "Matter is made up of very small _____", answer: "particles" },
      { question: "State of matter with fixed shape and volume is _____", answer: "solid" },
      { question: "State of matter with fixed volume but no fixed shape is _____", answer: "liquid" },
      { question: "State of matter with neither fixed shape nor volume is _____", answer: "gas" },
      { question: "Intermixing of particles of two different types of matter on their own is called _____", answer: "diffusion" },
      { question: "Fourth state of matter consisting of super energetic ionised gas is _____", answer: "plasma" },
      { question: "Fifth state of matter formed by cooling gas of low density is BEC (Bose-Einstein _____)", answer: "condensate" },
      { question: "Density is defined as mass per unit _____", answer: "volume" },
      { question: "Compressibility is highest in _____", answer: "gases" },
      { question: "Gas stored under high pressure in domestic cooking cylinders is _____", answer: "lpg" },
      { question: "Compressed Natural Gas used as fuel in vehicles is abbreviated as _____", answer: "cng" }
    ];

    let currentQuestions = [];
    let state = {};
    let score = 0;

    // Initialize Dropdown
    const selectElem = document.getElementById('chapterSelect');
    chapterNames.forEach((name, index) => {
      const opt = document.createElement('option');
      opt.value = index + 1;
      opt.textContent = name;
      selectElem.appendChild(opt);
    });

    function loadTest() {
      const chNum = selectElem.value;
      const pool = questionBank[chNum] || [];
      
      // Select 20 unique questions randomly
      const shuffled = [...pool].sort(() => 0.5 - Math.random());
      currentQuestions = shuffled.slice(0, 20);

      state = {};
      score = 0;
      updateStats();

      const container = document.getElementById('quizContainer');
      container.innerHTML = '';

      currentQuestions.forEach((q, idx) => {
        state[q.id] = { attempts: 0, solved: false };

        const card = document.createElement('div');
        card.className = 'q-card';
        card.id = `card-${q.id}`;

        card.innerHTML = `
          <div class="q-title">${idx + 1}. ${q.question}</div>
          <div class="input-wrapper">
            <input type="text" id="input-${q.id}" autocomplete="off" placeholder="Type answer here..." oninput="checkAnswer('${q.id}', '${q.answer}')" />
            <span class="status-icon" id="icon-${q.id}"></span>
          </div>
          <div class="feedback-msg" id="msg-${q.id}"></div>
        `;
        container.appendChild(card);
      });
    }

    function checkAnswer(qId, correctAnswer) {
      const qState = state[qId];
      if (qState.solved) return; // Freeze input if solved or auto-revealed

      const inputElem = document.getElementById(`input-${qId}`);
      const iconElem = document.getElementById(`icon-${qId}`);
      const msgElem = document.getElementById(`msg-${qId}`);
      const cardElem = document.getElementById(`card-${qId}`);

      const userVal = inputElem.value.trim().toLowerCase();
      const targetVal = correctAnswer.trim().toLowerCase();

      // Clear formatting if input is empty
      if (userVal === '') {
        cardElem.className = 'q-card';
        iconElem.textContent = '';
        msgElem.style.display = 'none';
        return;
      }

      // Check Correct Answer while typing
      if (userVal === targetVal) {
        qState.solved = true;
        cardElem.className = 'q-card is-correct';
        iconElem.textContent = '✓';
        iconElem.className = 'status-icon icon-correct';
        msgElem.textContent = 'Correct!';
        msgElem.style.color = 'var(--correct-text)';
        msgElem.style.display = 'block';
        inputElem.disabled = true;
        score++;
        updateStats();
        return;
      }

      // Wrong Answer Logic
      cardElem.className = 'q-card is-wrong';
      iconElem.textContent = '✗';
      iconElem.className = 'status-icon icon-wrong';

      // Record wrong attempt on Enter or blur event can also be tracked,
      // here incrementing per distinct wrong string entered
      qState.attempts += 1;

      if (qState.attempts >= 2) {
        qState.solved = true;
        cardElem.className = 'q-card is-correct';
        iconElem.textContent = '✓';
        iconElem.className = 'status-icon icon-correct';
        
        inputElem.value = correctAnswer; // Fill right answer
        inputElem.disabled = true;

        msgElem.innerHTML = `2 incorrect attempts used. Right answer: <span class="revealed-answer">${correctAnswer}</span>`;
        msgElem.style.display = 'block';
        updateStats();
      } else {
        msgElem.textContent = 'Incorrect. Try 1 more time.';
        msgElem.style.color = 'var(--wrong-text)';
        msgElem.style.display = 'block';
      }
    }

    function updateStats() {
      const completed = Object.values(state).filter(s => s.solved).length;
      document.getElementById('progressText').textContent = `Completed: ${completed} / ${currentQuestions.length}`;
      document.getElementById('scoreText').textContent = `Score: ${score}`;
    }

    // Load initial test
    loadTest();
  </script>
</body>
</html>
