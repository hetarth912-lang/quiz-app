<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class IX Science Practice Portal</title>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --accent-gray: #64748b;
      --text-main: #0f172a;
      --text-muted: #475569;
      --correct-bg: #dcfce7;
      --correct-border: #16a34a;
      --correct-text: #14532d;
      --wrong-bg: #fee2e2;
      --wrong-border: #dc2626;
      --wrong-text: #7f1d1d;
      --border-color: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 28px;
      margin-top: 10px;
    }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: var(--primary); font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
    header p { color: var(--text-muted); font-size: 0.9rem; }

    .selection-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
      background: #f8fafc;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .select-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    
    select {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      outline: none;
      font-size: 0.9rem;
      background: white;
      cursor: pointer;
      font-weight: 500;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 12px;
    }

    .badge {
      background: #e2e8f0;
      padding: 4px 10px;
      border-radius: 20px;
      color: var(--text-main);
    }

    .q-card {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .q-title { font-weight: 600; font-size: 1.1rem; line-height: 1.5; margin-bottom: 18px; color: var(--text-main); }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 2px solid var(--border-color);
      outline: none;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .status-icon {
      font-size: 1.4rem;
      font-weight: bold;
      min-width: 28px;
      text-align: center;
    }

    .icon-correct { color: var(--correct-border); }
    .icon-wrong { color: var(--wrong-border); }

    .feedback-msg {
      margin-top: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
    }

    /* Input State Styles */
    .is-correct input {
      background-color: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
    }

    .is-wrong input {
      background-color: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
    }

    .revealed-answer {
      color: var(--correct-text);
      font-weight: 700;
    }

    /* Action Buttons Navigation */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .btn {
      border: none;
      padding: 12px 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-secondary { background: #e2e8f0; color: var(--text-main); }
    .btn-secondary:hover { background: #cbd5e1; }

    .btn-warning { background: #fef3c7; color: #92400e; }
    .btn-warning:hover { background: #fde68a; }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    @media (max-width: 500px) {
      .selection-panel { grid-template-columns: 1fr; }
      .controls-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Class IX Science Practice Portal</h1>
      <p>Type your answer. 2 attempts allowed per question.</p>
    </header>

    <!-- Chapter & Mode Selection -->
    <div class="selection-panel">
      <div class="select-group">
        <label for="chapterSelect">Select Chapter</label>
        <select id="chapterSelect" onchange="initTest()"></select>
      </div>
      <div class="select-group">
        <label for="rangeSelect">Practice Range</label>
        <select id="rangeSelect" onchange="initTest()">
          <option value="all">Whole Chapter (All Questions)</option>
          <option value="p1">Page 1-5 (Questions 1-10)</option>
          <option value="p2">Page 6-10 (Questions 11-20)</option>
          <option value="p3">Page 11-15 (Questions 21-30)</option>
        </select>
      </div>
    </div>

    <!-- Status Header -->
    <div class="status-bar">
      <span class="badge" id="qTracker">Question 1 of 20</span>
      <span id="scoreText">Score: 0</span>
    </div>

    <!-- Question Box -->
    <div class="q-card" id="cardBox">
      <div class="q-title" id="qText"></div>
      <div class="input-wrapper">
        <input type="text" id="answerInput" autocomplete="off" placeholder="Type answer here..." oninput="handleInput()" />
        <span class="status-icon" id="statusIcon"></span>
      </div>
      <div class="feedback-msg" id="feedbackMsg"></div>
    </div>

    <!-- Control Buttons (No Generate Button) -->
    <div class="controls-grid">
      <button class="btn btn-secondary" id="btnPrev" onclick="navigate(-1)">Previous</button>
      <button class="btn btn-warning" id="btnSkip" onclick="skipQuestion()">Skip</button>
      <button class="btn btn-secondary" id="btnReset" onclick="resetQuestion()">Reset</button>
      <button class="btn btn-primary" id="btnNext" onclick="navigate(1)">Next</button>
    </div>
  </div>

  <script>
    const chapterNames = [
      "1. Matter in Our Surroundings",
      "2. Is Matter Around Us Pure?",
      "3. Atoms and Molecules",
      "4. Structure of the Atom",
      "5. The Fundamental Unit of Life",
      "6. Tissues",
      "7. Motion",
      "8. Force and Laws of Motion",
      "9. Gravitation",
      "10. Work and Energy",
      "11. Sound",
      "12. Improvement in Food Resources"
    ];

    const questionBank = {};

    // Generate Question Pools
    chapterNames.forEach((ch, idx) => {
      questionBank[idx + 1] = [];
      for (let i = 1; i <= 30; i++) {
        questionBank[idx + 1].push({
          id: `${idx + 1}_${i}`,
          question: `[Chapter ${idx + 1}] Practice Question ${i}: What is the core concept or unit for Topic #${i}?`,
          answer: `answer${i}`
        });
      }
    });

    // Detailed Chapter 1 Questions
    questionBank[1] = [
      { question: "SI unit of mass is _____", answer: "kilogram" },
      { question: "SI unit of volume is _____", answer: "cubic metre" },
      { question: "Solid carbon dioxide is commonly known as _____", answer: "dry ice" },
      { question: "Direct change of solid to gas without liquid state is called _____", answer: "sublimation" },
      { question: "Process of change of liquid into vapour below boiling point is _____", answer: "evaporation" },
      { question: "SI unit of temperature is _____", answer: "kelvin" },
      { question: "Rate of diffusion increases with increase in _____", answer: "temperature" },
      { question: "Forces of attraction between particles are maximum in _____", answer: "solids" },
      { question: "Forces of attraction between particles are minimum in _____", answer: "gases" },
      { question: "Boiling temperature of pure water in Celsius scale is _____ °C", answer: "100" },
      { question: "Melting point of ice in Kelvin scale is _____ K", answer: "273" },
      { question: "Evaporation causes a _____ effect.", answer: "cooling" },
      { question: "Heat required to melt 1kg solid at atmospheric pressure is latent heat of _____", answer: "fusion" },
      { question: "Heat required to change 1kg liquid to gas is latent heat of _____", answer: "vaporisation" },
      { question: "Matter is made up of very small _____", answer: "particles" },
      { question: "State of matter with fixed shape and volume is _____", answer: "solid" },
      { question: "State of matter with fixed volume but no fixed shape is _____", answer: "liquid" },
      { question: "State of matter with neither fixed shape nor volume is _____", answer: "gas" },
      { question: "Intermixing of particles of two different types of matter on their own is _____", answer: "diffusion" },
      { question: "Fourth state of matter consisting of super energetic ionised gas is _____", answer: "plasma" },
      { question: "Fifth state of matter formed by cooling gas of low density is BEC (Bose-Einstein _____)", answer: "condensate" },
      { question: "Density is defined as mass per unit _____", answer: "volume" },
      { question: "Compressibility is highest in _____", answer: "gases" },
      { question: "Gas stored under high pressure in domestic cooking cylinders is _____", answer: "lpg" },
      { question: "Compressed Natural Gas used as fuel in vehicles is abbreviated as _____", answer: "cng" }
    ];

    let currentQuestions = [];
    let currentIndex = 0;
    let state = {};
    let score = 0;

    // Populate Chapter Dropdown
    const selectElem = document.getElementById('chapterSelect');
    chapterNames.forEach((name, index) => {
      const opt = document.createElement('option');
      opt.value = index + 1;
      opt.textContent = name;
      selectElem.appendChild(opt);
    });

    function initTest() {
      const chNum = selectElem.value;
      const range = document.getElementById('rangeSelect').value;
      let pool = questionBank[chNum] || [];

      // Filter by range/page wise selection
      if (range === 'p1') pool = pool.slice(0, 10);
      else if (range === 'p2') pool = pool.slice(10, 20);
      else if (range === 'p3') pool = pool.slice(20, 30);

      // Randomize 20 unique questions (or max pool size)
      const shuffled = [...pool].sort(() => 0.5 - Math.random());
      currentQuestions = shuffled.slice(0, 20);

      currentIndex = 0;
      score = 0;
      state = {};

      currentQuestions.forEach((q) => {
        state[q.id] = { attempts: 0, solved: false, userValue: '' };
      });

      renderQuestion();
    }

    function renderQuestion() {
      const q = currentQuestions[currentIndex];
      const qState = state[q.id];

      document.getElementById('qTracker').textContent = `Question ${currentIndex + 1} of ${currentQuestions.length}`;
      document.getElementById('scoreText').textContent = `Score: ${score}`;
      document.getElementById('qText').textContent = `${currentIndex + 1}. ${q.question}`;

      const cardElem = document.getElementById('cardBox');
      const inputElem = document.getElementById('answerInput');
      const iconElem = document.getElementById('statusIcon');
      const msgElem = document.getElementById('feedbackMsg');

      inputElem.value = qState.userValue;
      inputElem.disabled = qState.solved;

      // Update Card Visuals based on saved state
      if (qState.solved) {
        cardElem.className = 'q-card is-correct';
        iconElem.textContent = '✓';
        iconElem.className = 'status-icon icon-correct';
        msgElem.style.display = 'block';
        if (qState.attempts >= 2) {
          msgElem.innerHTML = `2 attempts used. Right answer: <span class="revealed-answer">${q.answer}</span>`;
        } else {
          msgElem.textContent = 'Correct!';
          msgElem.style.color = 'var(--correct-text)';
        }
      } else if (qState.attempts === 1) {
        cardElem.className = 'q-card is-wrong';
        iconElem.textContent = '✗';
        iconElem.className = 'status-icon icon-wrong';
        msgElem.textContent = 'Incorrect. Try 1 more time.';
        msgElem.style.color = 'var(--wrong-text)';
        msgElem.style.display = 'block';
      } else {
        cardElem.className = 'q-card';
        iconElem.textContent = '';
        msgElem.style.display = 'none';
      }

      // Handle Previous / Next Button States
      document.getElementById('btnPrev').disabled = currentIndex === 0;
      document.getElementById('btnNext').disabled = currentIndex === currentQuestions.length - 1;
    }

    function handleInput() {
      const q = currentQuestions[currentIndex];
      const qState = state[q.id];
      if (qState.solved) return;

      const inputElem = document.getElementById('answerInput');
      const userVal = inputElem.value.trim().toLowerCase();
      const targetVal = q.answer.trim().toLowerCase();

      qState.userValue = inputElem.value;

      if (userVal === '') {
        document.getElementById('cardBox').className = 'q-card';
        document.getElementById('statusIcon').textContent = '';
        document.getElementById('feedbackMsg').style.display = 'none';
        return;
      }

      // Correct Answer Logic
      if (userVal === targetVal) {
        qState.solved = true;
        score++;
        renderQuestion();
        return;
      }

      // First Incorrect Attempt Logic
      if (qState.attempts === 0) {
        qState.attempts = 1;
      } else if (qState.attempts === 1 && userVal.length >= targetVal.length) {
        // Second Incorrect Attempt Logic -> Cross turns to Tick and reveals right answer
        qState.attempts = 2;
        qState.solved = true;
        qState.userValue = q.answer;
        renderQuestion();
      } else {
        renderQuestion();
      }
    }

    function navigate(direction) {
      const newIndex = currentIndex + direction;
      if (newIndex >= 0 && newIndex < currentQuestions.length) {
        currentIndex = newIndex;
        renderQuestion();
      }
    }

    function skipQuestion() {
      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    }

    function resetQuestion() {
      const q = currentQuestions[currentIndex];
      state[q.id] = { attempts: 0, solved: false, userValue: '' };
      renderQuestion();
    }

    // Initialize test on first load
    initTest();
  </script>
</body>
</html>
